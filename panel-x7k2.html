.mu{color:var(--mu)}.ov{overflow-x:auto}

#in.x{opacity:0;visibility:hidden}#in .dm{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both,fl 2s ease-in-out .9s infinite}#in .dm svg{width:84px;height:84px;display:block}#in .dm img{height:72px;border-radius:16px}

#in{display:none!important}
