const m=D.u.find(x=>x.id==session.user.id);D.me=m?m.u:null;

D.d=(d||[]).map(x=>({i:x.id,u:x.username,a:x.amount,utr:x.utr||'',st:x.status,t:new Date(x.created_at).toLocaleString()}));
if(m&&m.a&&!has)pushCfg()}
